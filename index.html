<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uide Fast Food - Меню</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f0f11;
      color: #fff;
      padding-bottom: 40px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1a1a1e;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid #ff5722;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #ff5722;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .lang-btn {
      background: #2a2a2e;
      color: #fff;
      border: 1px solid #ff5722;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-btn {
      position: relative;
      font-size: 22px;
      cursor: pointer;
      color: #ff5722;
    }

    .cart-badge {
      position: absolute;
      top: -8px;
      right: -10px;
      background: #ff5722;
      color: #fff;
      font-size: 11px;
      border-radius: 50%;
      padding: 2px 6px;
      font-weight: bold;
    }

    .info-bar {
      background-color: #25252b;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-around;
      font-size: 13px;
      color: #ccc;
      border-bottom: 1px solid #333;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-item i {
      color: #ff5722;
    }

    .info-item a {
      color: #ccc;
      text-decoration: none;
    }

    .categories {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      overflow-x: auto;
      background-color: #141417;
    }

    .cat-btn {
      background: #25252b;
      border: none;
      color: #aaa;
      padding: 8px 16px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: #ff5722;
      color: #fff;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #1a1a1e;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #2a2a2e;
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-content {
      padding: 12px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-price {
      font-size: 16px;
      font-weight: bold;
      color: #ff5722;
    }

    .add-btn {
      background: #ff5722;
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover {
      background: #e04818;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #1a1a1e;
      width: 90%;
      max-width: 450px;
      border-radius: 12px;
      padding: 20px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .close-btn {
      font-size: 24px;
      cursor: pointer;
      color: #888;
    }

    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      margin: 15px 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #25252b;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      background: #ff5722;
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-footer {
      border-top: 1px solid #333;
      padding-top: 15px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .order-btn {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>

    const categoryNames = {
      kk: { all: "Барлығы", doner: "Донер", burger: "Бургер/Крылышки", snack: "Снеки", pizza: "Пицца", hot: "Ыстық тағамдар", drinks: "Сусындар" },
      ru: { all: "Все", doner: "Донер", burger: "Бургеры/Крылышки", snack: "Снеки", pizza: "Пицца", hot: "Горячее", drinks: "Напитки" }
    };

    let cart = [];
    let activeCat = "all";

    function toggleLanguage() {
      currentLang = currentLang === 'kk' ? 'ru' : 'kk';
      document.getElementById('lang-label').textContent = currentLang === 'kk' ? 'RU' : 'KK';
      
      document.getElementById('delivery-text').textContent = translations[currentLang].delivery;
      document.getElementById('cart-title').textContent = translations[currentLang].cartTitle;
      document.getElementById('total-text').textContent = translations[currentLang].total;
      document.getElementById('order-btn-text').textContent = translations[currentLang].orderBtn;

      renderCategories();
      renderMenu();
      renderCart();
    }

    function renderCategories() {
      const catNav = document.getElementById('categories');
      catNav.innerHTML = '';
      const cats = categoryNames[currentLang];

      Object.keys(cats).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${activeCat === key ? 'active' : ''}`;
        btn.textContent = cats[key];
        btn.onclick = () => {
          activeCat = key;
          renderCategories();
          renderMenu();
        };
        catNav.appendChild(btn);
      });
    }

    function renderMenu() {
      const menuGrid = document.getElementById('menu-grid');
      menuGrid.innerHTML = '';

      const filtered = activeCat === 'all' 
        ? menuData 
        : menuData.filter(i => i.cat === activeCat);

      filtered.forEach((item) => {
        const name = item[`name_${currentLang}`];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.img}" alt="${name}">
          <div class="card-content">
            <div class="card-title">${name}</div>
            <div class="card-bottom">
              <div class="card-price">${item.price} ₸</div>
              <button class="add-btn" onclick="addToCart('${encodeURIComponent(name)}')">${translations[currentLang].add}</button>
            </div>
          </div>
        `;
        menuGrid.appendChild(card);
      });
    }

    function addToCart(encodedName) {
      const name = decodeURIComponent(encodedName);
      const item = menuData.find(i => i.name_kk === name || i.name_ru === name);
      const cartItem = cart.find(c => c.name === name);

      if (cartItem) {
        cartItem.qty++;
      } else {
        cart.push({ name, price: item.price, qty: 1 });
      }

      updateBadge();
    }

    function updateBadge() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-badge').textContent = totalQty;
    }

    function openCart() {
      renderCart();
      document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;

      cart.forEach((c, index) => {
        const itemTotal = c.price * c.qty;
        total += itemTotal;

        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div>
            <div><strong>${c.name}</strong></div>
            <small>${c.price} ₸ x ${c.qty} = ${itemTotal} ₸</small>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <span>${c.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        `;
        container.appendChild(div);
      });

      document.getElementById('total-amount').textContent = `${total} ₸`;
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      updateBadge();
      renderCart();
    }

    function sendOrder() {
      if (cart.length === 0) {
        alert(translations[currentLang].emptyCart);
        return;
      }

      let text = currentLang === 'kk' 
        ? "Саламатсыз ба! Менің тапсырысым:\n\n" 
        : "Здравствуйте! Мой заказ:\n\n";

      let total = 0;

      cart.forEach(c => {
        const itemTotal = c.price * c.qty;
        total += itemTotal;
        text += `- ${c.name} x${c.qty} = ${itemTotal} ₸\n`;
      });

      text += `\n${translations[currentLang].total} ${total} ₸\n`;
      text += currentLang === 'kk' ? "Жеткізу мекенжайы: Қарауыл ауылы, Ералы көшесі 22 Б" : "Адрес доставки: с. Караул, ул. Ералы 22 Б";

      const phone = "77002302331";
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    renderCategories();
    renderMenu();
  </script>
</body>
</html>
